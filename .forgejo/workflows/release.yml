"name": "Release"
"on":
  push:
    tags:
      - "mc-*"

jobs:
  release:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
      - name: Install git-cliff
        run: |
          curl -LO https://github.com/orhun/git-cliff/releases/download/v2.14.2/git-cliff-2.14.2-x86_64-unknown-linux-gnu.tar.gz
          tar -xzf git-cliff-2.14.2-x86_64-unknown-linux-gnu.tar.gz
          chmod +x git-cliff-*/git-cliff
          mv git-cliff-*/git-cliff /usr/local/bin
          rm git-cliff-*.tar.gz
          rm -rf git-cliff-*
      - name: Generate changelog
        run: |
          git-cliff -o CHANGELOG.md
      - name: Zip Datapack
        run: |
          apt-get update && apt-get install -y zip
          cd wrr-1.17.1
          zip -r ../wrr-1.17.1-0.0.176.zip .
          cd ..
          ls -la *.zip
      - name: Publish release
        run: |
          RESPONSE=$(curl -s -X POST \
            -H "Authorization: token ${{ secrets.DATAPACK_RELEASE_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\": \"mc-test-1\", \"name\": \"Test Release\", \"body\": \"test notes\"}" \
            https://git.jordanpicton.xyz/api/v1/repos/pictostudio/mc-datapack-wooden-recipes-revamp/releases)
          echo "$RESPONSE"
          RELEASE_ID=$(echo "$RESPONSE" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
            curl -s -X POST \
            -H "Authorization: token ${{ secrets.DATAPACK_RELEASE_TOKEN }}" \
            -F "attachment=@wrr-1.17.1-0.0.176.zip" \
            "https://git.jordanpicton.xyz/api/v1/repos/pictostudio/mc-datapack-wooden-recipes-revamp/releases/$RELEASE_ID/assets?name=wrr-1.17.1-0.0.176.zip"