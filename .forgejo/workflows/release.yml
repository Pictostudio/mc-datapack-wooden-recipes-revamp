"name": "Release"
"on":
  push:
    tags:
      - "mc-*"

jobs:
  release:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
      - name: Install git-cliff
        run: |
          apt-get install git-cliff
      - name: Generate changelog
        run: |
          git-cliff -o CHANGELOG.md