"name": "Release"
"on":
  push:
    tags:
      - "mc-*"

jobs:
  release:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
      - name: Set version info
        run: |
          TAG="${{ github.ref_name }}"
          MC_VERSION="${TAG#mc-}"          # strips "mc-" → 1.17.1-v0.0.176
          MC_VERSION="${MC_VERSION%%-*}"   # cuts at first dash → 1.17.1
          PACK_VERSION="${TAG##*-v}"       # keeps everything after "-v" → 0.0.176
          ZIP_NAME="wrr-${MC_VERSION}-${PACK_VERSION}.zip"

          echo "MC_VERSION=$MC_VERSION" >> "$GITHUB_ENV"
          echo "PACK_VERSION=$PACK_VERSION" >> "$GITHUB_ENV"
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"
      - name: Install git-cliff
        run: |
          curl -LO https://github.com/orhun/git-cliff/releases/download/v2.14.2/git-cliff-2.14.2-x86_64-unknown-linux-gnu.tar.gz
          tar -xzf git-cliff-2.14.2-x86_64-unknown-linux-gnu.tar.gz
          chmod +x git-cliff-*/git-cliff
          mv git-cliff-*/git-cliff /usr/local/bin
          rm git-cliff-*.tar.gz
          rm -rf git-cliff-*
      - name: Generate changelog
        run: |
          git-cliff -o CHANGELOG.md
      - name: Zip Datapack
        run: |
          apt-get update && apt-get install -y zip
          cd wrr-${{ env.MC_VERSION }}
          zip -r ../${{ env.ZIP_NAME }} .
          cd ..
          ls -la *.zip
      - name: Publish release
        run: |
          RESPONSE=$(curl -s -X POST \
            -H "Authorization: token ${{ secrets.DATAPACK_RELEASE_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\": \"${{ github.ref_name }}\", \"name\": \"wrr-${{ env.MC_VERSION }} ${{ env.PACK_VERSION }}\", \"body\": \"$(cat CHANGELOG.md | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')\"}" \
            https://git.jordanpicton.xyz/api/v1/repos/pictostudio/mc-datapack-wooden-recipes-revamp/releases)
          echo "$RESPONSE"
          RELEASE_ID=$(echo "$RESPONSE" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.DATAPACK_RELEASE_TOKEN }}" \
            -F "attachment=@${{ env.ZIP_NAME }}" \
            "https://git.jordanpicton.xyz/api/v1/repos/pictostudio/mc-datapack-wooden-recipes-revamp/releases/$RELEASE_ID/assets?name=${{ env.ZIP_NAME }}"